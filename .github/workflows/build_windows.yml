name: Build Flutter Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows Release
# Use the Windows Server 2022 / Visual Studio 2022 toolchain.
    # The newer VS 2026 MSVC in windows-2025 treats legacy <experimental/coroutine>
    # usage in webview_windows 0.4.0 as a hard STL1011 error.
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Enable Windows desktop and download artifacts
        shell: pwsh
        run: |
          flutter --version
          if ($LASTEXITCODE -ne 0) { throw 'Flutter is not available.' }

          flutter config --enable-windows-desktop
          if ($LASTEXITCODE -ne 0) { throw 'Could not enable Windows desktop support.' }

          flutter precache --windows
          if ($LASTEXITCODE -ne 0) { throw 'Could not download Flutter Windows artifacts.' }

      - name: Clean previous build output
        shell: pwsh
        run: |
          flutter clean
          if ($LASTEXITCODE -ne 0) { throw 'flutter clean failed.' }

          if (Test-Path 'build\windows') {
            Remove-Item 'build\windows' -Recurse -Force
          }

      # Regenerate the Windows runner from the exact Flutter SDK used by this build.
      # This runs only on the GitHub Actions checkout; it does not delete files in the repository.
      - name: Regenerate Windows platform files
        shell: pwsh
        run: |
          # Preserve the project's real application icon before regenerating runner files.
          $iconSource = 'windows\runner\resources\app_icon.ico'
          $iconBackup = Join-Path $env:RUNNER_TEMP 'emis-app-icon.ico'
          if (-not (Test-Path $iconSource)) { throw "Project icon is missing: $iconSource" }
          Copy-Item $iconSource $iconBackup -Force

          if (Test-Path 'windows') {
            Remove-Item 'windows' -Recurse -Force
          }

          flutter create --platforms=windows .
          if ($LASTEXITCODE -ne 0) { throw 'Failed to regenerate the Windows platform.' }

          $requiredFiles = @(
            'windows\CMakeLists.txt',
            'windows\flutter\CMakeLists.txt',
            'windows\runner\CMakeLists.txt',
            'windows\runner\main.cpp'
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              throw "Flutter did not generate required Windows file: $file"
            }
          }

          # Restore the exact ICO asset after flutter create has regenerated windows/.
          New-Item -ItemType Directory -Force -Path 'windows\runner\resources' | Out-Null
          Copy-Item $iconBackup 'windows\runner\resources\app_icon.ico' -Force
          if (-not (Test-Path 'windows\runner\resources\app_icon.ico')) {
            throw 'The original EMIS application icon was not restored.'
          }
          Write-Host 'Windows platform files regenerated; original EMIS icon restored.'

      - name: Resolve Flutter dependencies
        shell: pwsh
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw 'flutter pub get failed.' }

      - name: Prepare Local AI Windows stubs
        shell: pwsh
        run: |
          $stubScript = 'scripts\stub_local_ai.py'
          if (-not (Test-Path $stubScript)) {
            throw "Required script not found: $stubScript"
          }

          python $stubScript
          if ($LASTEXITCODE -ne 0) {
            throw "Local AI Windows stub preparation failed with exit code $LASTEXITCODE"
          }

      - name: Verify original Windows application icon
        shell: pwsh
        run: |
          $icoPath = 'windows\runner\resources\app_icon.ico'
          if (-not (Test-Path $icoPath)) { throw "Original EMIS icon is missing: $icoPath" }
          if ((Get-Item $icoPath).Length -lt 1000) { throw 'The EMIS ICO file appears invalid or empty.' }
          if (-not (Select-String -Path 'windows\runner\Runner.rc' -Pattern 'resources\\app_icon\.ico' -Quiet)) {
            throw 'Runner.rc does not reference the original app_icon.ico.'
          }
          Write-Host 'Verified original EMIS icon and Runner.rc reference.'

      - name: Build Windows EXE
        shell: pwsh
        run: |
          flutter build windows --release --dart-define=ENABLELOCALAI=false --verbose
          $buildExitCode = $LASTEXITCODE

          if ($buildExitCode -ne 0) {
            Write-Host '----- windows/flutter contents -----'
            if (Test-Path 'windows\flutter') {
              Get-ChildItem 'windows\flutter' -Force -Recurse |
                Select-Object -First 150 FullName, Length |
                Format-Table -AutoSize
            }

            Write-Host '----- windows/flutter/CMakeLists.txt -----'
            if (Test-Path 'windows\flutter\CMakeLists.txt') {
              Get-Content 'windows\flutter\CMakeLists.txt'
            }

            throw "flutter build windows failed with exit code $buildExitCode"
          }

      - name: Verify Windows release output
        shell: pwsh
        run: |
          $releaseDir = 'build\windows\x64\runner\Release'
          if (-not (Test-Path $releaseDir)) {
            throw "Windows release directory was not found: $releaseDir"
          }

          $exe = Get-ChildItem $releaseDir -Filter '*.exe' -File | Select-Object -First 1
          if (-not $exe) {
            throw "No EXE file was produced in $releaseDir"
          }

          Write-Host "Created executable: $($exe.FullName)"
          Get-ChildItem $releaseDir -Recurse -File |
            Measure-Object -Property Length -Sum |
            ForEach-Object { Write-Host "Release files: $($_.Count); total bytes: $($_.Sum)" }

      - name: Build Windows installer (EXE)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }

          $iscc = Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler was not found.' }
          & $iscc 'installer\EMIS-Setup.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

          $installer = 'installer-output\EMIS-Setup.exe'
          if (-not (Test-Path $installer)) { throw 'EMIS installer EXE was not created.' }
          Write-Host "Created installer: $installer"

      - name: Generate GitHub build provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: 'installer-output/EMIS-Setup.exe'

      - name: Upload Windows installer EXE
        uses: actions/upload-artifact@v4
        with:
          name: EMIS-Windows-Installer
          path: installer-output/EMIS-Setup.exe
          if-no-files-found: error
          retention-days: 14
